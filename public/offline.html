<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rapizz — Sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff1f1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #4a1116;
        padding: 24px;
      }
      .card {
        text-align: center;
        max-width: 360px;
      }
      svg { width: 160px; height: auto; margin-bottom: 8px; }
      h1 { font-size: 20px; margin: 12px 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #7a3238; margin: 0 0 20px; }
      button {
        background: #e11d2e;
        color: #fff6ea;
        border: none;
        border-radius: 999px;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 200 140" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="118" rx="70" ry="10" fill="#f3c9c9" opacity="0.6"/>
        <path d="M46 88c-16 0-28-12-28-27 0-14 11-26 25-27 4-16 19-28 37-28 20 0 37 14 40 33 14 2 24 13 24 27 0 15-12 27-27 27H46z" fill="#ffffff" stroke="#e2a9ab" stroke-width="3"/>
        <path d="M75 58l14 6M121 58l-14 6" stroke="#4a1116" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="82" cy="68" r="4.5" fill="#4a1116"/>
        <circle cx="114" cy="68" r="4.5" fill="#4a1116"/>
        <path d="M84 92q14 -10 28 0" stroke="#4a1116" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M78 74q3 8 0 14" stroke="#8fc3ef" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M64 96q-4 10-10 16" stroke="#9fb7d9" stroke-width="4" stroke-linecap="round"/>
        <path d="M100 100q-4 12-10 18" stroke="#9fb7d9" stroke-width="4" stroke-linecap="round"/>
        <path d="M134 96q-4 10-10 16" stroke="#9fb7d9" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <h1>Pedimos desculpas, mas estamos temporariamente fora do ar</h1>
      <p>Verifique sua conexão com a internet. Assim que ela voltar, o Rapizz volta a funcionar normalmente.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
